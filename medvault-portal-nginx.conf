# MedVault Portal - Nginx reverse proxy config
# Deploy path: /etc/nginx/conf.d/medvault-portal.conf
#
# Nginx stays on port 8080 (matching Portal-EC2-SG and the ALB Target Group
# from Phase 11), but now forwards everything to the Node app running on
# 127.0.0.1:3000 instead of serving static files directly.

server {
    listen 8080;
    server_name _;

    client_max_body_size 30M;   # allow uploads up to the app's 25MB limit + overhead

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    access_log /var/log/nginx/medvault-portal-access.log;
    error_log  /var/log/nginx/medvault-portal-error.log;
}
